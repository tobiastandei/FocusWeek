<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="135%" y2="135%">
      <stop offset="0%" style="stop-color:#9B8FFF"/>
      <stop offset="50%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#3D2FA8"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:white;stop-opacity:0.06"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Soft glow blob -->
  <ellipse cx="300" cy="180" rx="160" ry="120" fill="white" opacity="0.06"/>

  <!-- Glass card -->
  <rect x="64" y="120" width="384" height="200" rx="24" fill="url(#card)" stroke="white" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Three task rows inside card -->
  <!-- Row 1 - checked -->
  <rect x="96" y="152" width="320" height="40" rx="10" fill="white" opacity="0.08"/>
  <rect x="112" y="164" width="16" height="16" rx="4" fill="#6C63FF"/>
  <polyline points="115,172 119,177 126,168" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="140" y="169" width="140" height="6" rx="3" fill="white" opacity="0.5"/>
  <!-- strikethrough -->
  <rect x="140" y="171" width="140" height="2" rx="1" fill="white" opacity="0.3"/>

  <!-- Row 2 - unchecked -->
  <rect x="96" y="202" width="320" height="40" rx="10" fill="white" opacity="0.08"/>
  <rect x="112" y="214" width="16" height="16" rx="4" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="140" y="219" width="180" height="6" rx="3" fill="white" opacity="0.7"/>

  <!-- Row 3 - unchecked -->
  <rect x="96" y="252" width="320" height="40" rx="10" fill="white" opacity="0.08"/>
  <rect x="112" y="264" width="16" height="16" rx="4" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="140" y="269" width="110" height="6" rx="3" fill="white" opacity="0.7"/>

  <!-- Progress bar -->
  <rect x="64" y="344" width="384" height="8" rx="4" fill="white" opacity="0.12"/>
  <rect x="64" y="344" width="128" height="8" rx="4" fill="white" opacity="0.7" filter="url(#glow)"/>

  <!-- FOCUS text -->
  <text x="256" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="86" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-3">Focus</text>
  <text x="256" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="300" fill="white" text-anchor="middle" letter-spacing="16" opacity="0.55">WEEK</text>
</svg>
